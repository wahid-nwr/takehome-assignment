name: Publish Staging Image

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-southeast1
  PROJECT_ID: feature-flag-staging
  REPOSITORY: feature-flag
  IMAGE_NAME: feature-flag-service

  IMAGE: asia-southeast1-docker.pkg.dev/feature-flag-staging/feature-flag/feature-flag-service

jobs:
  docker:
    name: Build & Publish Staging Image

    runs-on: ubuntu-latest

    environment:
      name: staging

    concurrency:
      group: publish-staging
      cancel-in-progress: true

    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify identity
        run: |
          gcloud auth list

      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build & Publish Docker Image
        uses: ./.github/actions/docker
        with:
          push: "true"
          tags: |
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/environments/staging
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/environments/staging
        run: |
          terraform plan \
            -out=tfplan \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="container_image=${{ env.IMAGE }}:sha-${{ github.sha }}" \
            -var='invoker_members=${{ vars.STAGING_INVOKER_MEMBERS }}'

      - name: Terraform Apply
        working-directory: terraform/environments/staging
        run: terraform apply -auto-approve tfplan