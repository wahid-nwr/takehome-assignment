name: Docker Build

description: Build and optionally publish Docker images

inputs:
  context:
    required: false
    description: All docker build and publishing
    default: .

  dockerfile:
    required: false
    description: Dockerfile
    default: Dockerfile

  target:
    required: false
    description: Target environment
    default: production

  tags:
    description: Tag images
    required: true

  push:
    required: false
    description: Push artifactory choice
    default: "false"

  github-token:
    description: Github token requirement
    required: true

runs:
  using: composite

  steps:

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      if: inputs.push == 'true'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false