name: Docker Build

description: Build and optionally publish Docker images

inputs:
  context:
    default: "."
    required: false

  dockerfile:
    default: "Dockerfile"
    required: false

  target:
    default: "production"
    required: false

  tags:
    required: true

  push:
    default: "false"
    required: false

runs:
  using: composite

  steps:

    - uses: docker/setup-buildx-action@v3

    - uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false